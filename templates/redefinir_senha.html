{% extends 'base.html' %}
{% block content %}
<section class="auth-wrapper" style="max-width: 450px; margin: 80px auto; padding: 20px;">
    <div class="auth-card" style="background: white; padding: 40px; border-radius: 16px; box-shadow: var(--shadow);">
        <h2 style="color: var(--dark); text-align: center; margin-bottom: 10px;">Nova Senha</h2>
        <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem; margin-bottom: 25px;">Defina sua nova credencial de acesso segura para a plataforma.</p>
        
        <form action="{{ url_for('redefinir_senha', token=token) }}" method="POST">
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Nova Senha</label>
                <input type="password" name="senha" required placeholder="••••••••" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none;">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Alterar Senha Oficial</button>
        </form>
    </div>
</section>
{% endblock %}
