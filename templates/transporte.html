<h2>🚚 Transporte de Peixes</h2>

<p>
O transporte inadequado pode causar estresse e até morte.
</p>

<h3>Cuidados</h3>

<ul>
    <li>Use sacos apropriados</li>
    <li>Evite mudanças bruscas de temperatura</li>
    <li>Mantenha o recipiente fechado</li>
</ul>

<h3>Chegada</h3>

<p>
Faça aclimatação lenta antes de introduzir o peixe ao aquário.
</p>
