{% extends 'base.html' %}
{% block content %}
<section class="auth-wrapper" style="max-width: 450px; margin: 80px auto; padding: 20px;">
    <div class="auth-card" style="background: white; padding: 40px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid #f1f5f9;">
        <div class="auth-header" style="text-align: center; margin-bottom: 30px;">
            <h2 style="color: var(--dark); font-size: 1.8rem;">Acesse sua Conta</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Clientes e Funcionários utilizam o mesmo portal de entrada</p>
        </div>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">E-mail Corporativo ou Pessoal</label>
                <input type="email" name="email" required placeholder="seu@email.com" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none;">
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Senha de Acesso</label>
                <input type="password" name="senha" required placeholder="••••••••" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none;">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Entrar no Sistema</button>
        </form>

        <div class="auth-footer" style="text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--text-muted);">
            Não possui conta? <a href="{{ url_for('cadastro_cliente') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Cadastre-se como Cliente</a>
        </div>
    </div>
</section>
{% endblock %}
