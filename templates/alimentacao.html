<h2>🐟 Alimentação dos Peixes</h2>

<p>
Uma alimentação equilibrada aumenta a expectativa de vida dos peixes.
</p>

<h3>Frequência</h3>

<p>
Alimente 1 a 2 vezes por dia.
</p>

<h3>Quantidade</h3>

<p>
Apenas o que for consumido em até 3 minutos.
</p>

<h3>Evite</h3>

<ul>
    <li>Excesso de ração</li>
    <li>Alimentos vencidos</li>
</ul>
