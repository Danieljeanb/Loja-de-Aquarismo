<h2>🧹 Limpeza do Aquário</h2>

<p>
A limpeza deve ser feita sem comprometer as bactérias benéficas.
</p>

<h3>Vidros</h3>

<p>
Use limpadores magnéticos ou esponjas próprias.
</p>

<h3>Cascalho</h3>

<p>
Utilize um sifão para remover sujeira acumulada.
</p>

<h3>Filtro</h3>

<p>
Faça limpeza parcial usando água retirada do próprio aquário.
</p>
