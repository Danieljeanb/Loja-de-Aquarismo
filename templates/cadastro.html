{% extends 'base.html' %}
{% block content %}
<section class="auth-wrapper" style="max-width: 450px; margin: 80px auto; padding: 20px;">
    <div class="auth-card" style="background: white; padding: 40px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid #f1f5f9;">
        <div class="auth-header" style="text-align: center; margin-bottom: 30px;">
            <h2 style="color: var(--dark); font-size: 1.8rem;">Crie sua Conta</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Faça parte do nosso clube de vantagens de aquarismo profissional</p>
        </div>
        
        <form action="{{ url_for('cadastro_cliente') }}" method="POST">
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Nome Completo</label>
                <input type="text" name="nome" required placeholder="Ex: João Silva" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none;">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Endereço de E-mail</label>
                <input type="email" name="email" required placeholder="joao@email.com" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none;">
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem;">Defina sua Senha</label>
                <input type="password" name="senha" required placeholder="Mínimo 6 caracteres" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none;">
            </div>

            <button type="submit" class="btn-secondary" style="width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; background: var(--dark); color: white;">Finalizar Registro</button>
        </form>

        <div class="auth-footer" style="text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--text-muted);">
            Já possui cadastro? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Realizar Login</a>
        </div>
    </div>
</section>
{% endblock %}
