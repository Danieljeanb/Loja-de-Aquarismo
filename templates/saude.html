<h2>❤️ Saúde dos Peixes</h2>

<p>
Observar os peixes diariamente ajuda a detectar doenças precocemente.
</p>

<h3>Sinais de alerta</h3>

<ul>
    <li>Pontos brancos</li>
    <li>Nadadeiras fechadas</li>
    <li>Falta de apetite</li>
    <li>Respiração acelerada</li>
</ul>

<h3>Prevenção</h3>

<p>
Mantenha a qualidade da água e faça quarentena para novos peixes.
</p>
