{% extends 'base.html' %}
{% block content %}
<section class="sucesso-container" style="max-width: 600px; margin: 80px auto; text-align: center; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
    
    <div class="sucesso-icone" style="font-size: 4rem; color: #10b981; margin-bottom: 20px;">
        <i class="fa-solid fa-circle-check"></i>
    </div>
    
    <h2 style="color: #0f172a; margin-bottom: 10px;">Pedido Pré-Aprovado!</h2>
    <p style="color: #64748b; font-size: 1.05rem; margin-bottom: 30px;">
        Seu pedido foi registrado no sistema. Para garantir a separação e entrega, conclua o atendimento com nossos atendentes.
    </p>

    <div class="acoes-sucesso" style="display: flex; flex-direction: column; gap: 15px;">
        <!-- Botão WhatsApp -->
        <a href="{{ link_whatsapp }}" target="_blank" class="btn-whats-sucesso" style="display: flex; align-items: center; justify-content: center; gap: 10px; background: #25d366; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 1.1rem; box-shadow: 0 4px 12px rgba(37,211,102,0.2);">
            <i class="fa-brands fa-whatsapp" style="font-size: 1.4rem;"></i> Enviar para o WhatsApp
        </a>

        <!-- Botão PDF -->
        <a href="{{ url_for('gerar_pdf', pedido_id=pedido_id) }}" class="btn-pdf-sucesso" style="display: flex; align-items: center; justify-content: center; gap: 10px; background: #ef4444; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1rem;">
            <i class="fa-solid fa-file-pdf"></i> Baixar Comprovante em PDF
        </a>
    </div>

    <div style="margin-top: 25px;">
        <a href="{{ url_for('index') }}" style="color: #0070f3; text-decoration: none; font-weight: 500;">Voltar para a Página Inicial</a>
    </div>

</section>
{% endblock %}
